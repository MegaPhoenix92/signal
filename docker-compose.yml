services:
  api:
    build: .
    ports:
      - "8787:8787"
    environment:
      SIGNAL_ALLOW_LOCAL_ACTOR: "true"
      SIGNAL_ADMIN_STATE: /app/data/signal-local.json
      SIGNAL_API_HOST: 0.0.0.0
      SIGNAL_API_PORT: "8787"
      SIGNAL_BACKEND_MODE: external-service
      SIGNAL_STATE_SERVICE_URL: http://state-service:8791/state
      SIGNAL_STATE_SERVICE_TOKEN: local-compose-state-token
      SIGNAL_OAUTH_STATE_KEY: signal-compose-oauth-state-key
      SIGNAL_SESSION_SECRET: signal-compose-session-secret-32chars
    volumes:
      - signal-data:/app/data
    depends_on:
      - state-service

  web:
    build: .
    command: ["node", "scripts/signal-frontend-server.mjs"]
    ports:
      - "5173:8080"
    environment:
      SIGNAL_FRONTEND_HOST: 0.0.0.0
      SIGNAL_FRONTEND_PORT: "8080"
    depends_on:
      - api

  scheduler:
    build: .
    command: ["node", "scripts/signal-scheduler.mjs", "--once"]
    environment:
      SIGNAL_ADMIN_STATE: /app/data/signal-local.json
      SIGNAL_SCHEDULER_ONCE: "true"
      SIGNAL_STATE_SERVICE_URL: http://state-service:8791/state
      SIGNAL_STATE_SERVICE_TOKEN: local-compose-state-token
    volumes:
      - signal-data:/app/data
    depends_on:
      - state-service

  state-service:
    build: .
    command: ["node", "scripts/signal-state-service.mjs"]
    ports:
      - "8791:8791"
    environment:
      SIGNAL_STATE_SERVICE_HOST: 0.0.0.0
      SIGNAL_STATE_SERVICE_PORT: "8791"
      SIGNAL_STATE_SERVICE_TOKEN: local-compose-state-token
      SIGNAL_STATE_SERVICE_BACKEND: file
      SIGNAL_STATE_SERVICE_FILE: /app/data/signal-state-service.json
    volumes:
      - signal-data:/app/data

volumes:
  signal-data: