name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint backend scripts
        run: npm run lint
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium
      - name: Build
        run: npm run build
      - name: Test
        env:
          SIGNAL_CHROME_BIN: /usr/bin/chromium
          SIGNAL_CHROME_NO_SANDBOX: "true"
        run: npm run test:local
